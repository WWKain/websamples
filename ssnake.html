<!DOCTYPE html>
<html lang="it">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Simple snake</title>
		<style>
			:root {
				--violet: #6000ee;
				--green: #60dd00;
				--red: #ff4444;
				--dark: #101010;
				--light: #eeeeee;
				--darksquare: #151515;
				--lightsquare: #e7e7e7;
				--board-width: min(400px, calc(100vw - 150px), calc((100dvh - 60px) / 2.3));
			}
			html,
			body {
				overflow-x: hidden;
			}
			body {
				margin: 0;
				background: var(--dark);
				color: var(--light);
				font-family: Arial, sans-serif;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				min-height: 100dvh;
				-webkit-user-select: none;
				user-select: none;
				-webkit-touch-callout: none;
			}
			html.light body {
				background: var(--light);
				color: var(--dark);
			}
			.logo {
				display: block;
				height: auto;
				width: var(--board-width);
				margin: 0 0 calc(var(--board-width) * 0.125);
				fill: var(--green);
			}
			.logo.centerable {
				cursor: pointer;
			}
			html.light .logo {
				fill: var(--violet);
			}
			#scores {
				position: relative;
				z-index: 4;
				display: flex;
				gap: calc(var(--board-width) * 0.06);
				margin-bottom: calc(var(--board-width) * 0.26);
				font-size: max(14px, calc(var(--board-width) * 0.055));
			}
			@media (orientation: landscape) and (pointer: coarse),
			(orientation: landscape) and (max-height: 480px) {
				:root {
					--board-width: min(400px, calc(100vw - 150px), 88dvh);
				}
				body {
					padding-bottom: calc((100dvh - var(--board-width)) / 2);
				}
				.logo {
					margin-top: calc(var(--board-width) * 0.125);
				}
			}
			#arena {
				display: flex;
			}
			#board {
				position: relative;
				touch-action: none;
			}
			#fire {
				position: absolute;
				z-index: 3;
				pointer-events: none;
			}
			#game {
				display: block;
				width: var(--board-width);
				height: auto;
				background: #111;
			}
			#overlay {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				background: rgba(0, 0, 0, 0.65);
			}
			html.light #overlay {
				background: rgba(255, 255, 255, 0.65);
			}
			#overlay[hidden] {
				display: none;
			}
			#gameOver {
				color: var(--green);
				font-size: 28px;
			}
			html.light #gameOver {
				color: var(--violet);
			}
			button {
				margin-top: 14px;
				padding: 10px 20px;
				font-size: 16px;
				border: none;
				border-radius: 5px;
				background: var(--green);
				color: var(--dark);
				cursor: pointer;
			}
			html.light button {
				background: var(--violet);
				color: var(--light);
			}
			#toolbar {
				position: fixed;
				top: 6px;
				right: 14px;
				z-index: 10;
				display: flex;
				gap: 10px;
			}
			.iconBtn {
				width: 40px;
				height: 40px;
				border-radius: 50%;
				border: 2px solid var(--green);
				background: var(--darksquare);
				color: var(--green);
				display: flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				padding: 0;
			}
			html.light .iconBtn {
				border: 2px solid var(--violet);
				background: var(--lightsquare);
				color: var(--violet);
			}
			.iconBtn svg {
				width: 20px;
				height: 20px;
				display: block;
			}
			.iconBtn .moonIcon {
				display: none;
			}
			html.light .iconBtn .sunIcon {
				display: none;
			}
			html.light .iconBtn .moonIcon {
				display: block;
			}
			#controlsOverlay {
				position: fixed;
				inset: 0;
				z-index: 20;
				display: flex;
				overflow: auto;
				padding: 28px;
				box-sizing: border-box;
				background: rgba(0, 0, 0, 0.65);
			}
			html.light #controlsOverlay {
				background: rgba(255, 255, 255, 0.65);
			}
			#controlsOverlay[hidden] {
				display: none;
			}
			#controlsPopup {
				position: relative;
				background: var(--darksquare);
				color: var(--light);
				border: 2px solid var(--green);
				border-radius: 12px;
				padding: 26px 30px;
				margin: auto;
				box-sizing: border-box;
				max-width: min(320px, 100%);
			}
			html.light #controlsPopup {
				background: var(--lightsquare);
				color: var(--dark);
				border: 2px solid var(--violet);
			}
			#controlsPopup h2 {
				margin-top: 0;
				color: var(--green);
			}
			html.light #controlsPopup h2 {
				color: var(--violet);
			}
			.ctrl-desktop {
				display: block;
			}
			.ctrl-touch {
				display: none;
			}
			@media (pointer: coarse) {
				.ctrl-desktop {
					display: none;
				}
				.ctrl-touch {
					display: block;
				}
			}
			#controlsClose {
				position: absolute;
				margin: 0;
				top: -16px;
				right: -16px;
				width: 32px;
				height: 32px;
				border-radius: 50%;
				border: none;
				background: var(--green);
				color: var(--darksquare);
				display: flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				font-size: 16px;
				line-height: 1;
				padding: 0;
			}
			html.light #controlsClose {
				background: var(--violet);
				color: var(--lightsquare);
			}
		</style>
	</head>

		</div>
		<div id="controlsOverlay" hidden>
			<div id="controlsPopup">
				<button id="controlsClose" aria-label="Chiudi">&#10006;</button>
				<h2>Comandi</h2>
				<p class="ctrl-desktop">Usa le frecce direzionali o W A S D per muovere il serpente.</p>
				<p class="ctrl-touch">Usa lo swipe dentro il quadrato di gioco per muovere il serpente.</p>
			</div>
		</div>
		<script>
			const CELL = 20;
			const BASE_DELAY = 120;
			const MIN_DELAY = 60;
			const SPEEDUP_EVERY = 5;
			const SPEEDUP_STEP = 8;
			const MAX_QUEUED_TURNS = 2;
			const SWIPE_THRESHOLD = 24;
			const BEST_KEY = "Best";
			const THEME_KEY = "Theme";
			const COLORS = {
				background: cssColorStr("--darksquare"),
				food: cssColorStr("--red"),
				eye: cssColorStr("--dark"),
				head: [124, 255, 124],
				tail: [76, 175, 80]
			};
			const FOOD_RGB = cssColorRGB("--red");
			const DIRECTIONS = {
				up: {
					x: 0,
					y: -1
				},
				down: {
					x: 0,
					y: 1
				},
				left: {
					x: -1,
					y: 0
				},
				right: {
					x: 1,
					y: 0
				}
			};
			const KEY_TO_DIRECTION = {
				ArrowUp: DIRECTIONS.up,
				ArrowDown: DIRECTIONS.down,
				ArrowLeft: DIRECTIONS.left,
				ArrowRight: DIRECTIONS.right,
				w: DIRECTIONS.up,
				s: DIRECTIONS.down,
				a: DIRECTIONS.left,
				d: DIRECTIONS.right,
				W: DIRECTIONS.up,
				S: DIRECTIONS.down,
				A: DIRECTIONS.left,
				D: DIRECTIONS.right
			};
			const FIRE = {
				sideMargin: 60,
				topMargin: 120,
				bottomMargin: 26,
				topReach: 84,
				sideReach: 34,
				bottomDown: 9,
				blendBand: 22,
				frameMs: 33
			};
			const canvas = document.getElementById("game");
			const ctx = canvas.getContext("2d");
			const scoreEl = document.getElementById("score");
			const bestEl = document.getElementById("best");
			const overlay = document.getElementById("overlay");
			const restartBtn = document.getElementById("restartBtn");
			const boardEl = document.getElementById("board");
			const fireCanvas = document.getElementById("fire");
			const fireCtx = fireCanvas.getContext("2d");
			const fireToggleBtn = document.getElementById("fireToggleBtn");
			const themeToggleBtn = document.getElementById("themeToggleBtn");
			const gamepadBtn = document.getElementById("gamepadBtn");
			const controlsOverlay = document.getElementById("controlsOverlay");
			const controlsClose = document.getElementById("controlsClose");
			const logoEl = document.querySelector(".logo");
			const cells = canvas.width / CELL;
			let snake, direction, turnQueue, food, score, delay, timer, isOver;
			let best = loadBest();
			let isLightTheme = loadTheme();
			let fireEnabled = true;
			let accentRGB = cssColorRGB("--green");
			let touchStartX = 0,
				touchStartY = 0,
				touchActive = false;
			function loadBest() {
				try {
					return parseInt(localStorage.getItem(BEST_KEY)) || 0;
				} catch (e) {
					return 0;
				}
			}
			function saveBest() {
				try {
					localStorage.setItem(BEST_KEY, best);
				} catch (e) {}
			}
			function loadTheme() {
				try {
					return localStorage.getItem(THEME_KEY) === "light";
				} catch (e) {
					return false;
				}
			}
			function saveTheme() {
				try {
					localStorage.setItem(THEME_KEY, isLightTheme ? "light" : "dark");
				} catch (e) {}
			}
			function startGame() {
				snake = [{
					x: 10,
					y: 10
				}, {
					x: 9,
					y: 10
				}, {
					x: 8,
					y: 10
				}];
				direction = {
					x: 0,
					y: 0
				};
				turnQueue = [];
				score = 0;
				delay = BASE_DELAY;
				isOver = false;
				food = randomFood();
				overlay.hidden = true;
				updateScores();
				restartLoop();
				render();
			}
			function restartLoop() {
				clearInterval(timer);
				timer = setInterval(step, delay);
			}
			function isWaitingToStart() {
				return direction.x === 0 && direction.y === 0 && turnQueue.length === 0;
			}
			function step() {
				if (isWaitingToStart()) return;
				if (turnQueue.length) direction = turnQueue.shift();
				const head = {
					x: snake[0].x + direction.x,
					y: snake[0].y + direction.y
				};
				const willEat = head.x === food.x && head.y === food.y;
				if (hitsWall(head) || hitsSnake(head, !willEat)) {
					endGame();
					return;
				}
				snake.unshift(head);
				if (willEat) {
					eatFood();
				} else {
					snake.pop();
				}
				render();
			}
			function hitsWall({
				x,
				y
			}) {
				return x < 0 || y < 0 || x >= cells || y >= cells;
			}
			function hitsSnake(head, tailWillMove) {
				const last = snake.length - 1;
				return snake.some((part, i) => i > 0 && !(tailWillMove && i === last) && part.x === head.x && part.y === head.y);
			}
			function eatFood() {
				score++;
				if (score > best) {
					best = score;
					saveBest();
				}
				updateScores();
				food = randomFood();
				const newDelay = Math.max(MIN_DELAY, BASE_DELAY - Math.floor(score / SPEEDUP_EVERY) * SPEEDUP_STEP);
				if (newDelay !== delay) {
					delay = newDelay;
					restartLoop();
				}
			}
			function randomFood() {
				let spot;
				do {
					spot = {
						x: Math.floor(Math.random() * cells),
						y: Math.floor(Math.random() * cells)
					};
				} while (snake.some(part => part.x === spot.x && part.y === spot.y));
				return spot;
			}
			function endGame() {
				isOver = true;
				clearInterval(timer);
				render();
				overlay.hidden = false;
			}
			function updateScores() {
				scoreEl.textContent = "Punti: " + score;
				bestEl.textContent = "Record: " + best;
			}
			function queueTurn(next) {
				if (isOver || turnQueue.length >= MAX_QUEUED_TURNS) return;
				const waiting = isWaitingToStart();
				const last = turnQueue.length ? turnQueue[turnQueue.length - 1] : direction;
				const ref = waiting ? DIRECTIONS.right : last;
				const isReverse = next.x === -ref.x && next.y === -ref.y;
				const isSame = next.x === ref.x && next.y === ref.y;
				if (isReverse || (isSame && !waiting)) return;
				turnQueue.push(next);
			}
			document.addEventListener("keydown", e => {
				const next = KEY_TO_DIRECTION[e.key];
				if (!next) return;
				e.preventDefault();
				queueTurn(next);
			});
			restartBtn.addEventListener("click", startGame);
			document.addEventListener("contextmenu", e => e.preventDefault());
			document.addEventListener("selectstart", e => e.preventDefault());
			boardEl.addEventListener("touchstart", e => {
				if (e.touches.length !== 1) return;
				touchActive = true;
				touchStartX = e.touches[0].clientX;
				touchStartY = e.touches[0].clientY;
			}, {
				passive: true
			});
			boardEl.addEventListener("touchmove", e => {
				e.preventDefault();
			}, {
				passive: false
			});
			boardEl.addEventListener("touchend", e => {
				if (!touchActive) return;
				touchActive = false;
				const touch = e.changedTouches[0];
				const dx = touch.clientX - touchStartX;
				const dy = touch.clientY - touchStartY;
				if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_THRESHOLD) return;
				if (Math.abs(dx) > Math.abs(dy)) {
					queueTurn(dx > 0 ? DIRECTIONS.right : DIRECTIONS.left);
				} else {
					queueTurn(dy > 0 ? DIRECTIONS.down : DIRECTIONS.up);
				}
			}, {
				passive: true
			});
			function lerpArr(from, to, t) {
				return [
					from[0] + (to[0] - from[0]) * t,
					from[1] + (to[1] - from[1]) * t,
					from[2] + (to[2] - from[2]) * t
				];
			}
			function toRGBStr(arr) {
				return `rgb(${Math.round(arr[0])}, ${Math.round(arr[1])}, ${Math.round(arr[2])})`;
			}
			function edgeBlendFactor(x, y) {
				if (!fireEnabled) return 0;
				const d = Math.min(x, y, cells - 1 - x, cells - 1 - y);
				if (d === 0) return 0.8;
				if (d === 1) return 0.5;
				if (d === 2) return 0.22;
				return 0;
			}
			function drawCell({
				x,
				y
			}, color) {
				ctx.fillStyle = color;
				ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
			}
			function drawEyes({
				x,
				y
			}) {
				const facing = isWaitingToStart() ? DIRECTIONS.right : direction;
				const cx = x * CELL + CELL / 2;
				const cy = y * CELL + CELL / 2;
				const forward = 4,
					side = 4.5,
					radius = 2;
				ctx.fillStyle = COLORS.eye;
				ctx.strokeStyle = COLORS.eye;
				ctx.lineWidth = 1.4;
				for (const sign of [-1, 1]) {
					const ex = cx + facing.x * forward - facing.y * side * sign;
					const ey = cy + facing.y * forward + facing.x * side * sign;
					if (isOver) {
						const r = radius + 0.6;
						ctx.beginPath();
						ctx.moveTo(ex - r, ey - r);
						ctx.lineTo(ex + r, ey + r);
						ctx.moveTo(ex - r, ey + r);
						ctx.lineTo(ex + r, ey - r);
						ctx.stroke();
					} else {
						ctx.beginPath();
						ctx.arc(ex, ey, radius, 0, Math.PI * 2);
						ctx.fill();
					}
				}
			}
			function render() {
				ctx.fillStyle = COLORS.background;
				ctx.fillRect(0, 0, canvas.width, canvas.height);
				const foodF = edgeBlendFactor(food.x, food.y);
				const foodCol = foodF > 0 ? toRGBStr(lerpArr(FOOD_RGB, accentRGB, foodF)) : COLORS.food;
				drawCell(food, foodCol);
				const last = Math.max(1, snake.length - 1);
				snake.forEach((part, i) => {
					const base = lerpArr(COLORS.head, COLORS.tail, i / last);
					const f = edgeBlendFactor(part.x, part.y);
					const col = f > 0 ? lerpArr(base, accentRGB, f) : base;
					drawCell(part, toRGBStr(col));
				});
				drawEyes(snake[0]);
			}
			function cssColorRGB(varName) {
				const probe = document.createElement("canvas");
				probe.width = probe.height = 1;
				const pctx = probe.getContext("2d");
				pctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
				pctx.fillRect(0, 0, 1, 1);
				const d = pctx.getImageData(0, 0, 1, 1).data;
				return [d[0], d[1], d[2]];
			}
			function cssColorStr(varName) {
				const [r, g, b] = cssColorRGB(varName);
				return `rgb(${r}, ${g}, ${b})`;
			}
			function applyTheme() {
				document.documentElement.classList.toggle("light", isLightTheme);
				COLORS.background = cssColorStr(isLightTheme ? "--lightsquare" : "--darksquare");
				accentRGB = cssColorRGB(isLightTheme ? "--violet" : "--green");
				setupFire();
				render();
			}
			fireToggleBtn.addEventListener("click", () => {
				fireEnabled = !fireEnabled;
				fireToggleBtn.setAttribute("aria-pressed", String(fireEnabled));
				fireCanvas.style.display = fireEnabled ? "block" : "none";
				render();
			});
			themeToggleBtn.addEventListener("click", () => {
				isLightTheme = !isLightTheme;
				saveTheme();
				applyTheme();
			});
			gamepadBtn.addEventListener("click", () => {
				controlsOverlay.hidden = false;
			});
			controlsClose.addEventListener("click", () => {
				controlsOverlay.hidden = true;
			});
			let fireScale = 1,
				fireInv = 1,
				fireDims;
			let fireW = 0,
				fireImage = null,
				lastFrame = 0,
				wavePhase = 0;
			let boardLeft = 0,
				boardRight = 0,
				boardTop = 0,
				boardBottom = 0;
			let pixelIdx = null,
				edgeDist = null,
				outsideDist = null;
			let nodeS = 1,
				nodeW = 0,
				nodeH = 0;
			let nodeBase = null,
				nodeTx = null,
				nodeTy = null;
			let nodeList = null,
				nodeNx = null,
				nodeNy0 = null,
				nodeWl = null,
				nodeWr = null,
				nodeW0 = null,
				nodeV = null;
			function hash2(ix, iy) {
				let h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263);
				h = Math.imul(h ^ (h >>> 13), 1274126177);
				return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
			}
			function vnoise(x, y) {
				const ix = Math.floor(x),
					iy = Math.floor(y);
				const fx = x - ix,
					fy = y - iy;
				const u = fx * fx * (3 - 2 * fx),
					v = fy * fy * (3 - 2 * fy);
				const a = hash2(ix, iy),
					b = hash2(ix + 1, iy);
				const c = hash2(ix, iy + 1),
					d = hash2(ix + 1, iy + 1);
				return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
			}
			function fbm(x, y) {
				return 0.5 * vnoise(x, y) + 0.3 * vnoise(x * 2.03 + 5.2, y * 2.03 + 1.3) + 0.2 * vnoise(x * 4.1 + 9.7, y * 4.1 + 6.1);
			}
			function smooth01(v) {
				v = v < 0 ? 0 : v > 1 ? 1 : v;
				return v * v * (3 - 2 * v);
			}
			function fireNoise(nx, ny) {
				const wx = vnoise(nx * 0.8 + 11.3, ny * 0.8 + 2.1);
				const wy = vnoise(nx * 0.8 + 4.7, ny * 0.8 + 8.9);
				nx += (wx - 0.5) * 1.5;
				ny += (wy - 0.5) * 0.7;
				return (fbm(nx, ny) - 0.15) / 0.6 + 0.1;
			}
			function scaledFireDims(s) {
				return {
					sideMargin: Math.ceil(FIRE.sideMargin * s),
					topMargin: Math.ceil(FIRE.topMargin * s),
					bottomMargin: Math.ceil(FIRE.bottomMargin * s),
					topReach: FIRE.topReach * s,
					sideReach: FIRE.sideReach * s,
					bottomDown: FIRE.bottomDown * s,
					band: FIRE.blendBand * s
				};
			}
			function resizeFireCanvas(bw, bh) {
				const {
					sideMargin,
					topMargin,
					bottomMargin
				} = fireDims;
				fireW = bw + 2 * sideMargin;
				const fireH = bh + topMargin + bottomMargin;
				fireCanvas.style.left = -sideMargin + "px";
				fireCanvas.style.top = -topMargin + "px";
				fireCanvas.style.width = fireW + "px";
				fireCanvas.style.height = fireH + "px";
				fireCanvas.width = fireW;
				fireCanvas.height = fireH;
				fireImage = fireCtx.createImageData(fireW, fireH);
				const rgb = cssColorRGB(isLightTheme ? "--violet" : "--green");
				const data = fireImage.data;
				for (let i = 0; i < data.length; i += 4) {
					data[i] = rgb[0];
					data[i + 1] = rgb[1];
					data[i + 2] = rgb[2];
					data[i + 3] = 0;
				}
			}
			function distanceOutsideBoard(px) {
				return px < boardLeft ? boardLeft - px : px > boardRight ? px - boardRight : 0;
			}
			function makeReachUp(boardHeight) {
				const s = fireScale;
				const center = 12 * s;
				const edge = Math.min(55 * s, boardHeight * 0.3);
				const span = 70 * s;
				return function reachUp(px) {
					const dEdge = Math.min(px - boardLeft, boardRight - px);
					let tt = dEdge / span;
					tt = tt < 0 ? 0 : tt > 1 ? 1 : tt;
					tt = 1 - tt;
					const sm = tt * tt * (3 - 2 * tt);
					return center + (edge - center) * sm;
				};
			}
			function flameDistance(px, py, dx, reachUp) {
				const {
					sideReach,
					topReach,
					bottomDown
				} = fireDims;
				if (dx > sideReach * 1.1) return null;
				let qq;
				if (py > boardBottom) {
					if (py > boardBottom + bottomDown * 1.6) return null;
					qq = dx / sideReach;
				} else if (dx === 0) {
					if (py < boardTop) {
						qq = (boardTop - py) / topReach;
					} else {
						const ru = reachUp(px);
						if (py < boardBottom - ru) return null;
						qq = (boardBottom - py) / ru;
					}
				} else {
					const dyTop = py < boardTop ? (boardTop - py) / topReach : 0;
					const dxn = dx / sideReach;
					qq = Math.sqrt(dxn * dxn + dyTop * dyTop);
				}
				return qq > 1.1 ? null : qq;
			}
			function buildFirePixels(boardHeight) {
				const reachUp = makeReachUp(boardHeight);
				const fireH = fireImage.height;
				nodeS = Math.max(1, 2 * fireScale);
				nodeW = Math.ceil(fireW / nodeS) + 2;
				nodeH = Math.ceil(fireH / nodeS) + 2;
				const needed = new Uint8Array(nodeW * nodeH);
				const idx = [],
					q = [],
					out = [],
					base = [],
					txs = [],
					tys = [];
				for (let y = 0; y < fireH; y++) {
					for (let x = 0; x < fireW; x++) {
						const px = x + 0.5,
							py = y + 0.5;
						const dx = distanceOutsideBoard(px);
						const qq = flameDistance(px, py, dx, reachUp);
						if (qq === null) continue;
						const fx = px / nodeS,
							fy = py / nodeS;
						const ix = Math.floor(fx),
							iy = Math.floor(fy);
						const b0 = iy * nodeW + ix;
						needed[b0] = needed[b0 + 1] = needed[b0 + nodeW] = needed[b0 + nodeW + 1] = 1;
						idx.push(y * fireW + x);
						q.push(qq);
						out.push(dx);
						base.push(b0);
						txs.push(fx - ix);
						tys.push(fy - iy);
					}
				}
				pixelIdx = Int32Array.from(idx);
				edgeDist = Float32Array.from(q);
				outsideDist = Float32Array.from(out);
				nodeBase = Int32Array.from(base);
				nodeTx = Float32Array.from(txs);
				nodeTy = Float32Array.from(tys);
				return needed;
			}
			function buildFireNodes(needed) {
				const list = [];
				for (let n = 0; n < needed.length; n++)
					if (needed[n]) list.push(n);
				nodeList = Int32Array.from(list);
				const m = nodeList.length;
				nodeNx = new Float32Array(m);
				nodeNy0 = new Float32Array(m);
				nodeWl = new Float32Array(m);
				nodeWr = new Float32Array(m);
				nodeW0 = new Float32Array(m);
				nodeV = new Float32Array(nodeW * nodeH);
				const band = fireDims.band;
				for (let j = 0; j < m; j++) {
					const n = nodeList[j];
					const gx = n % nodeW,
						gy = (n - gx) / nodeW;
					const npx = gx * nodeS,
						npy = gy * nodeS;
					const ndx = distanceOutsideBoard(npx);
					const wl = smooth01((boardLeft + band - npx) / (2 * band));
					const wr = smooth01((npx - (boardRight - band)) / (2 * band));
					nodeWl[j] = wl;
					nodeWr[j] = wr;
					nodeW0[j] = 1 - wl - wr;
					nodeNx[j] = npx * fireInv * 0.05;
					nodeNy0[j] = npy * fireInv * 0.02 + ndx * fireInv * 0.022;
				}
			}
			function setupFire() {
				const bw = boardEl.clientWidth,
					bh = boardEl.clientHeight;
				fireScale = bw / 400;
				fireInv = 1 / fireScale;
				fireDims = scaledFireDims(fireScale);
				resizeFireCanvas(bw, bh);
				boardLeft = fireDims.sideMargin;
				boardRight = boardLeft + bw;
				boardTop = fireDims.topMargin;
				boardBottom = boardTop + bh;
				wavePhase = Math.random() * 6.28;
				buildFireNodes(buildFirePixels(bh));
			}
			function updateNodeNoise(t) {
				const scroll = t * 1.5;
				const drift = t * 1.6;
				for (let j = 0; j < nodeList.length; j++) {
					const nx = nodeNx[j],
						ny = nodeNy0[j] + scroll;
					const a = nodeWl[j],
						b = nodeWr[j],
						c = nodeW0[j];
					let v = 0;
					if (a > 0) v += a * fireNoise(nx + drift, ny);
					if (b > 0) v += b * fireNoise(nx - drift, ny);
					if (c > 0) v += c * fireNoise(nx, ny);
					nodeV[nodeList[j]] = v;
				}
			}
			function fireFade(px, py, dx, edge, t) {
				const {
					sideReach,
					topReach,
					bottomDown
				} = fireDims;
				let fade = 1;
				if (dx > 0) {
					const hFrac = dx / sideReach;
					fade = hFrac >= 1 ? 0 : 1 - hFrac;
				}
				if (py < boardTop) {
					const vFrac = (boardTop - py) / topReach;
					fade *= vFrac >= 1 ? 0 : 1 - vFrac;
				} else if (py > boardBottom) {
					const arg = px * fireInv * Math.PI / 70 + 1.3 * Math.sin(px * fireInv * 0.02 + wavePhase + t * 0.3);
					const amp = 0.55 + 0.45 * vnoise(px * fireInv * 0.04 + wavePhase, 3.3 + t * 0.4);
					const down = 4 * fireScale + bottomDown * amp * (0.5 + 0.5 * Math.sin(arg));
					const edgeA = (boardBottom + down - py) / (2.5 * fireScale);
					fade *= edgeA < 0 ? 0 : edgeA > 1 ? 1 : edgeA;
				} else if (dx === 0) {
					const vFrac = edge < 0 ? 0 : edge > 1 ? 1 : edge;
					fade *= 1 - vFrac;
				}
				return fade;
			}
			function paintFirePixels(t) {
				const data = fireImage.data;
				for (let k = 0; k < pixelIdx.length; k++) {
					const i = pixelIdx[k];
					const x = i % fireW,
						y = (i - x) / fireW;
					const fade = fireFade(x + 0.5, y + 0.5, outsideDist[k], edgeDist[k], t);
					if (fade <= 0.004) {
						data[i * 4 + 3] = 0;
						continue;
					}
					const b0 = nodeBase[k],
						tx = nodeTx[k],
						ty = nodeTy[k];
					const v00 = nodeV[b0],
						v10 = nodeV[b0 + 1],
						v01 = nodeV[b0 + nodeW],
						v11 = nodeV[b0 + nodeW + 1];
					const top = v00 + (v10 - v00) * tx,
						bot = v01 + (v11 - v01) * tx;
					const v = top + (bot - top) * ty;
					let alpha = (v - edgeDist[k]) * 35 + 0.5;
					alpha = alpha < 0 ? 0 : alpha > 1 ? 1 : alpha;
					data[i * 4 + 3] = alpha * fade * 255;
				}
			}
			function drawFire(now) {
				const t = now / 1000;
				updateNodeNoise(t);
				paintFirePixels(t);
				fireCtx.putImageData(fireImage, 0, 0);
			}
			function fireLoop(now) {
				requestAnimationFrame(fireLoop);
				if (!fireEnabled) return;
				if (now - lastFrame < FIRE.frameMs) return;
				lastFrame = now;
				drawFire(now);
			}
			function needsCentering() {
				return document.documentElement.scrollHeight > window.innerHeight + 1;
			}
			function updateLogoState() {
				logoEl.classList.toggle("centerable", needsCentering());
			}
			function centerBoard() {
				if (!needsCentering()) return;
				const rect = boardEl.getBoundingClientRect();
				const target = window.scrollY + rect.top + rect.height / 2 - window.innerHeight / 2;
				window.scrollTo({
					top: Math.max(0, target),
					behavior: "smooth"
				});
			}
			logoEl.addEventListener("click", centerBoard);
			window.addEventListener("resize", setupFire);
			window.addEventListener("resize", updateLogoState);
			window.addEventListener("orientationchange", updateLogoState);
			setupFire();
			updateLogoState();
			requestAnimationFrame(fireLoop);
			startGame();
			if (isLightTheme) applyTheme();
		</script>
	</body>
</html>
