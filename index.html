<!DOCTYPE html>
<html lang="it">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="color-scheme" content="light dark">
		<meta name="theme-color" content="#000000">
		<title>Portfolio</title>
		<script>
			try {
				if (!location.hash.includes("intro") && sessionStorage.getItem("introDone")) document.documentElement.classList.add("no-intro");
			} catch (e) {}
		</script>
		<style>
			:root {
				--bg: #404040;
				--svg-color: #424242;
				--bar: #151515;
				--bar-text: #eeeeee;
				--text: #bbbbbb;
				--tile: #505050;
				--accent: #5000bbaa;
				--label: #707070;
				--icon-min: 120px;
				--intro-bg: #eeeeee;
				--t-svg: 0s;
				--t-fade: 1s;
				--t-bar: 1.7s;
				--t-icons: 2s;
				--t-rules: 2.5s;
				--t-titles: 2.9s;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--intro-bg: #202020;
				}
			}
			* {
				box-sizing: border-box;
			}
			html {
				background: var(--intro-bg);
			}
			body {
				margin: 0;
				min-height: 100vh;
				color: var(--text);
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			.art {
				position: fixed;
				inset: 0;
				z-index: 0;
				pointer-events: none;
			}
			.art svg {
				position: absolute;
				top: 3vmin;
				left: 3vmin;
				width: calc(100% - 6vmin);
				height: calc(100% - 6vmin);
			}
			.art-intro svg {
				fill: var(--accent);
			}
			.art-site {
				background: var(--bg);
			}
			.art-site svg {
				fill: var(--svg-color);
			}
			.topbar {
				position: sticky;
				top: 0;
				z-index: 10;
				background: var(--bar);
				color: var(--bar-text);
				padding: 15px 28px;
				font-size: 15px;
				font-weight: 600;
				letter-spacing: .22em;
				text-transform: uppercase;
			}
			main {
				position: relative;
				z-index: 1;
				width: min(1100px, 100%);
				margin: auto;
				padding: 40px 28px 80px;
			}
			.group {
				margin-bottom: 46px;
			}
			.group h2 {
				margin: 0;
				overflow: hidden;
				color: var(--label);
				font-size: 12px;
				font-weight: 600;
				letter-spacing: .14em;
				text-transform: uppercase;
			}
			.group h2 span {
				display: block;
			}
			.rule {
				height: 1px;
				margin: 7px 0 24px;
				background: var(--label);
				transform-origin: left center;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(var(--icon-min), 1fr));
				gap: 28px 24px;
			}
			.app {
				display: block;
				min-width: 0;
				color: inherit;
				text-decoration: none;
				text-align: center;
				-webkit-tap-highlight-color: transparent;
			}
			.preview {
				position: relative;
				overflow: hidden;
				width: 100%;
				aspect-ratio: 1;
				border-radius: 14px;
				background: var(--tile);
				border: 0;
				box-shadow: 0 6px 18px #00000030;
				display: grid;
				place-items: center;
				transition: transform .25s cubic-bezier(.2, .8, .2, 1),
					box-shadow .25s ease,
					border-color .25s ease;
			}
			.preview img {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
			}
			.preview .fallback {
				font-size: 34px;
				font-weight: 700;
				color: var(--label);
			}
			.name {
				display: block;
				min-height: 1.4em;
				margin-top: 14px;
				font-size: 13px;
				font-weight: 500;
				line-height: 1.4;
				overflow-wrap: anywhere;
				opacity: 0;
				transform: translateY(-6px);
				transition: opacity .2s ease, transform .2s ease;
				position: relative;
				z-index: 1;
			}
			.app:hover .preview,
			.app:focus-visible .preview {
				transform: scale(1.09) translateY(-4px);
				border: 0;
				box-shadow: 0 0 18px 4px var(--accent), 0 16px 34px #00000055;
			}
			.app:hover .name,
			.app:focus-visible .name {
				opacity: 1;
				transform: none;
			}
			.app:active .preview {
				transform: scale(1.02);
			}
			@media (hover: none) {
				.name {
					opacity: 1;
					transform: none;
				}
			}
			@media (max-width: 520px) {
				:root {
					--icon-min: 88px;
				}
				.topbar {
					padding: 13px 18px;
				}
				main {
					padding: 28px 16px 60px;
				}
				.grid {
					gap: 22px 14px;
				}
				.name {
					font-size: 12px;
				}
			}
			@keyframes fade {
				from {
					opacity: 0
				}
			}
			@keyframes slide {
				from {
					transform: translateX(-100%)
				}
			}
			@keyframes pop {
				from {
					transform: scale(.02);
					opacity: 0
				}
			}
			@keyframes grow {
				from {
					transform: scaleX(0)
				}
			}
			@keyframes rise {
				from {
					transform: translateY(110%)
				}
			}
			.art-intro {
				animation: fade .9s ease-out var(--t-svg) backwards;
			}
			.art-site {
				animation: fade .9s ease-in-out var(--t-fade) backwards;
			}
			.topbar {
				animation: slide .6s cubic-bezier(.2, .8, .2, 1) var(--t-bar) backwards;
			}
			.app {
				animation: pop .55s cubic-bezier(.2, .8, .2, 1) calc(var(--t-icons) + var(--i, 0) * .045s) backwards;
			}
			.rule {
				animation: grow .8s cubic-bezier(.6, 0, .2, 1) calc(var(--t-rules) + var(--g, 0) * .15s) backwards;
			}
			.group h2 span {
				animation: rise .55s cubic-bezier(.2, .8, .2, 1) calc(var(--t-titles) + var(--g, 0) * .15s) backwards;
			}
			.no-intro .art-intro,
			.no-intro .art-site,
			.no-intro .topbar,
			.no-intro .app,
			.no-intro .rule,
			.no-intro .group h2 span {
				animation: none;
			}
			@media (prefers-reduced-motion: reduce) {
				.art-intro,
				.art-site,
				.topbar,
				.app,
				.rule,
				.group h2 span {
					animation: none;
				}
				.preview,
				.name {
					transition-duration: .01ms;
				}
			}
			.expander {
				position: fixed;
				z-index: 100;
				overflow: hidden;
				background: var(--tile);
				transition: top .5s cubic-bezier(.65, 0, .25, 1),
					left .5s cubic-bezier(.65, 0, .25, 1),
					width .5s cubic-bezier(.65, 0, .25, 1),
					height .5s cubic-bezier(.65, 0, .25, 1),
					border-radius .5s ease,
					background-color .5s ease;
			}
			.expander img {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
				transition: opacity .5s ease;
			}
			.expander.open {
				background: var(--bg);
			}
			.expander.open img {
				opacity: 0;
			}
			@media (prefers-reduced-motion: reduce) {
				.expander,
				.expander img {
					transition-duration: .01ms;
				}
			}
		</style>
	</head>

				link.href = href;
				link.style.setProperty("--i", Math.min(index, 10));
				link.setAttribute("aria-label", name);
				const box = document.createElement("div");
				box.className = "preview";
				const fallback = document.createElement("span");
				fallback.className = "fallback";
				fallback.textContent = name.charAt(0).toUpperCase();
				box.appendChild(fallback);
				const img = document.createElement("img");
				img.alt = "";
				img.loading = "lazy";
				img.src = THUMB + href;
				img.onerror = () => img.remove();
				box.appendChild(img);
				const label = document.createElement("span");
				label.className = "name";
				label.textContent = name;
				link.append(box, label);
				link.addEventListener("click", e => {
					if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;
					e.preventDefault();
					expandAndGo(box, img, href);
				});
				return link;
			}
			function expandAndGo(box, img, href) {
				try {
					sessionStorage.setItem("introDone", "1");
				} catch (e) {}
				const r = box.getBoundingClientRect();
				const o = document.createElement("div");
				o.className = "expander";
				Object.assign(o.style, {
					top: r.top + "px",
					left: r.left + "px",
					width: r.width + "px",
					height: r.height + "px",
					borderRadius: getComputedStyle(box).borderRadius
				});
				if (img.isConnected && img.complete && img.naturalWidth) o.appendChild(img.cloneNode());
				document.body.appendChild(o);
				o.getBoundingClientRect();
				requestAnimationFrame(() => {
					o.classList.add("open");
					Object.assign(o.style, {
						top: "0px",
						left: "0px",
						width: innerWidth + "px",
						height: innerHeight + "px",
						borderRadius: "0px"
					});
				});
				setTimeout(() => {
					location.href = href;
				}, 560);
			}
			window.addEventListener("pageshow", () => {
				document.querySelectorAll(".expander").forEach(el => el.remove());
			});
			groups.forEach((g, gi) => {
				if (!g.sites.length) return;
				const section = document.createElement("section");
				section.className = "group";
				section.style.setProperty("--g", gi);
				const title = document.createElement("h2");
				const titleText = document.createElement("span");
				titleText.textContent = g.title;
				title.appendChild(titleText);
				const rule = document.createElement("div");
				rule.className = "rule";
				const grid = document.createElement("div");
				grid.className = "grid";
				g.sites.forEach(([name, url], i) => grid.appendChild(makeTile(name, url, i)));
				section.append(title, rule, grid);
				root.appendChild(section);
			});
		</script>
	</body>
</html>
